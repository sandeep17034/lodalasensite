<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>IP Checker</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px;
      display: grid; place-items: center;
      background: #0b1220; color: #e5e7eb;
      font: 15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
    }
    main {
      width: min(100%, 520px); padding: 28px;
      border: 1px solid #263449; border-radius: 18px;
      background: #121d2e; box-shadow: 0 18px 50px #0005;
    }
    h1 { margin: 0 0 8px; font-size: 24px; }
    .muted { color: #9ca3af; }
    .ip {
      margin: 22px 0; padding: 18px; border-radius: 12px;
      background: #1c2b40; overflow-wrap: anywhere;
      color: #7dd3fc; font-size: clamp(22px, 6vw, 32px);
      font-weight: 700;
    }
    dl { margin: 0; }
    .item {
      display: grid; grid-template-columns: 125px 1fr; gap: 12px;
      padding: 13px 0; border-top: 1px solid #29384c;
    }
    dt { color: #9ca3af; }
    dd { margin: 0; overflow-wrap: anywhere; }
    #status { margin-top: 18px; font-size: 13px; }
    .ok { color: #86efac; }
    .err { color: #fca5a5; }
    footer { margin-top: 20px; color: #9ca3af; font-size: 12px; }
  </style>
</head>
<body>
<main>
  <h1>Your IP information</h1>
  <p class="muted">The address seen by this website.</p>
  <div class="ip" id="ip">Checking…</div>
  <dl>
    <div class="item"><dt>IP version</dt><dd id="version">—</dd></div>
    <div class="item"><dt>Time</dt><dd id="time">—</dd></div>
    <div class="item"><dt>Browser / device</dt><dd id="browser">—</dd></div>
    <div class="item"><dt>Language</dt><dd id="language">—</dd></div>
  </dl>
  <div id="status" class="muted" role="status">Recording this visit…</div>
  <footer>Your visit information is recorded by the site operator for basic traffic logging.</footer>
</main>
<script>
(async () => {
  const el = id => document.getElementById(id);
  el('browser').textContent = navigator.userAgent || 'Not provided';
  el('language').textContent = navigator.language || 'Not provided';
  el('time').textContent = new Date().toLocaleString();

  try {
    const response = await fetch('log.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        user_agent: navigator.userAgent || '',
        language: navigator.language || '',
        page: location.pathname
      }),
      cache: 'no-store',
      credentials: 'same-origin'
    });
    const data = await response.json();
    if (!response.ok || !data.ok) throw new Error(data.error || 'Request failed');

    el('ip').textContent = data.ip;
    el('version').textContent = data.ip_version;
    el('status').textContent = 'Visit recorded successfully.';
    el('status').className = 'ok';
  } catch (error) {
    el('ip').textContent = 'Unable to determine IP';
    el('status').textContent = 'Could not record this visit. Check that PHP is enabled and log.php is reachable.';
    el('status').className = 'err';
  }
})();
</script>
</body>
</html>
